services:
  - type: web
    name: hydra-curls-backend
    env: python
    region: oregon # or frankfurt, ohio, etc.
    plan: free
    rootDir: assignment-2-backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./hydracurls.db
      - key: JWT_SECRET
        sync: false
      - key: STRIPE_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
